<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --bg: #f6f8fb;
      --panel: #ffffff;
      --ink: #17212b;
      --muted: #65717d;
      --line: #dbe3ea;
      --teal: #2f7d86;
      --blue: #3468a8;
      --amber: #b7791f;
      --red: #b94a48;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Arial, sans-serif;
      font-size: 14px;
    }

    .app {
      max-width: 1440px;
      margin: 0 auto;
      padding: 18px 20px 32px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-start;
      margin-bottom: 14px;
    }

    .top-actions {
      display: grid;
      gap: 8px;
      justify-items: end;
    }

    .manage-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 190px;
      height: 36px;
      border: 1px solid var(--teal);
      border-radius: 6px;
      background: var(--teal);
      color: #fff;
      font-weight: 700;
      text-decoration: none;
      padding: 0 12px;
    }

    h1 {
      margin: 0 0 5px;
      font-size: 24px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .subtitle {
      color: var(--muted);
      font-size: 13px;
    }

    .filters {
      display: grid;
      grid-template-columns: repeat(5, minmax(140px, 1fr));
      gap: 10px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 14px;
    }

    label {
      color: var(--muted);
      display: block;
      font-size: 12px;
      margin-bottom: 4px;
    }

    input, select, button {
      width: 100%;
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      padding: 0 10px;
      font: inherit;
    }

    button {
      background: var(--teal);
      border-color: var(--teal);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      margin-top: 20px;
    }

    .kpis {
      display: grid;
      grid-template-columns: repeat(8, minmax(120px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .kpi, .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .kpi {
      padding: 12px;
      min-height: 92px;
    }

    .kpi button {
      height: 28px;
      margin-top: 10px;
      padding: 0 8px;
      background: #eef4f7;
      border-color: var(--line);
      color: var(--teal);
      font-size: 12px;
      font-weight: 700;
    }

    .kpi .label {
      color: var(--muted);
      min-height: 34px;
      line-height: 1.25;
    }

    .kpi .value {
      font-size: 26px;
      font-weight: 800;
      margin-top: 8px;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(340px, 1fr);
      gap: 14px;
    }

    .detail-panel {
      display: none;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      margin: 0 0 14px;
      overflow: hidden;
    }

    .detail-panel.open {
      display: block;
    }

    .detail-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      background: #eef4f7;
      border-bottom: 1px solid var(--line);
    }

    .detail-head h2 {
      margin: 0;
      font-size: 15px;
    }

    .detail-head button {
      width: auto;
      height: 28px;
      margin: 0;
      background: #fff;
      color: var(--muted);
      border-color: var(--line);
      padding: 0 10px;
    }

    .panel {
      overflow: hidden;
      margin-bottom: 14px;
    }

    .panel h2 {
      margin: 0;
      padding: 12px 14px;
      font-size: 15px;
      background: #eef4f7;
      border-bottom: 1px solid var(--line);
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
    }

    th, td {
      border-bottom: 1px solid var(--line);
      padding: 9px 10px;
      text-align: left;
      vertical-align: top;
      line-height: 1.35;
    }

    th {
      background: #f4f6f8;
      color: #27313a;
      font-size: 12px;
      white-space: nowrap;
    }

    td.empty {
      color: var(--muted);
      text-align: center;
      padding: 22px;
    }

    .badge {
      display: inline-block;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 12px;
      font-weight: 700;
      background: #e8f2f3;
      color: var(--teal);
      white-space: nowrap;
    }

    .badge.work {
      background: #fff4db;
      color: var(--amber);
    }

    .badge.other {
      background: #f7e9ea;
      color: var(--red);
    }

    .bars {
      padding: 12px 14px 14px;
    }

    .bar-row {
      display: grid;
      grid-template-columns: minmax(145px, 1fr) minmax(120px, 2fr) 54px;
      gap: 8px;
      align-items: center;
      margin: 8px 0;
    }

    .bar-label {
      color: #25313b;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .bar-track {
      height: 10px;
      background: #e8edf2;
      border-radius: 999px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: var(--blue);
      border-radius: 999px;
      min-width: 2px;
    }

    .bar-value {
      text-align: right;
      font-weight: 700;
    }

    .status {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      align-items: center;
      color: var(--muted);
      font-size: 12px;
      min-width: 210px;
    }

    .loader {
      padding: 20px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 1100px) {
      .kpis { grid-template-columns: repeat(4, 1fr); }
      .filters { grid-template-columns: repeat(2, 1fr); }
      .grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 640px) {
      .app { padding: 14px; }
      .topbar { display: block; }
      .top-actions { justify-items: stretch; margin-top: 10px; }
      .status { justify-content: flex-start; margin-top: 8px; }
      .kpis, .filters { grid-template-columns: 1fr; }
      h1 { font-size: 20px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="topbar">
      <div>
        <h1>Dashboard vắng mặt lãnh đạo phòng/khoa</h1>
        <div class="subtitle" id="periodText">Đang tải dữ liệu...</div>
      </div>
      <div class="top-actions">
        <a class="manage-link" href="https://script.google.com/macros/s/AKfycbwxKtzxJ_XcpIFuxp3VrBAkrjXHrnuGcZNxDcBqhNdLcG2QheYXF7_U33fCp_HCzsisQg/exec" target="_blank" rel="noopener noreferrer">Mở quản lý</a>
        <div class="status" id="statusText"></div>
      </div>
    </section>

    <section class="filters">
      <div>
        <label for="fromDate">Từ ngày</label>
        <input id="fromDate" type="date">
      </div>
      <div>
        <label for="toDate">Đến ngày</label>
        <input id="toDate" type="date">
      </div>
      <div>
        <label for="typeFilter">Loại vắng mặt</label>
        <select id="typeFilter"></select>
      </div>
      <div>
        <label for="statusFilter">Tình trạng duyệt</label>
        <select id="statusFilter"></select>
      </div>
      <div>
        <label for="searchBox">Tìm nhanh</label>
        <input id="searchBox" type="search" placeholder="Tên, khoa/phòng, lý do">
      </div>
      <button id="applyBtn" type="button">Cập nhật</button>
    </section>

    <section class="kpis" id="kpis"></section>

    <section class="detail-panel" id="detailPanel">
      <div class="detail-head">
        <h2 id="detailTitle">Chi tiết</h2>
        <button id="closeDetailBtn" type="button">Đóng</button>
      </div>
      <div class="table-wrap" id="detailBody"></div>
    </section>

    <section class="grid">
      <div>
        <div class="panel">
          <h2>Đang vắng hôm nay</h2>
          <div class="table-wrap" id="todayTable"></div>
        </div>
        <div class="panel">
          <h2>Sắp vắng trong 02 tháng tới</h2>
          <div class="table-wrap" id="upcomingTable"></div>
        </div>
      </div>

      <aside>
        <div class="panel">
          <h2>Cơ cấu ngày vắng theo loại</h2>
          <div class="bars" id="typeBars"></div>
        </div>
        <div class="panel">
          <h2>Top đơn vị theo số ngày vắng</h2>
          <div class="bars" id="unitBars"></div>
        </div>
        <div class="panel">
          <h2>Tình trạng duyệt</h2>
          <div class="bars" id="statusBars"></div>
        </div>
      </aside>
    </section>
  </main>

  <script>
    const state = {
      loadedOptions: false,
      defaultType: 'Tất cả',
      defaultStatus: 'Tất cả',
      latestData: null,
    };
    const API_ENDPOINT = 'https://absence-dashboard-api-worker.phongtccb.workers.dev/';

    const els = {
      fromDate: document.getElementById('fromDate'),
      toDate: document.getElementById('toDate'),
      typeFilter: document.getElementById('typeFilter'),
      statusFilter: document.getElementById('statusFilter'),
      searchBox: document.getElementById('searchBox'),
      applyBtn: document.getElementById('applyBtn'),
      kpis: document.getElementById('kpis'),
      periodText: document.getElementById('periodText'),
      statusText: document.getElementById('statusText'),
      detailPanel: document.getElementById('detailPanel'),
      detailTitle: document.getElementById('detailTitle'),
      detailBody: document.getElementById('detailBody'),
      closeDetailBtn: document.getElementById('closeDetailBtn'),
      todayTable: document.getElementById('todayTable'),
      upcomingTable: document.getElementById('upcomingTable'),
      typeBars: document.getElementById('typeBars'),
      unitBars: document.getElementById('unitBars'),
      statusBars: document.getElementById('statusBars'),
    };

    document.addEventListener('DOMContentLoaded', () => {
      els.applyBtn.addEventListener('click', refreshDashboard);
      els.searchBox.addEventListener('keydown', event => {
        if (event.key === 'Enter') refreshDashboard();
      });
      els.closeDetailBtn.addEventListener('click', closeDetail);
      loadDashboardFromCache();
    });

    async function fetchDashboard(action, filters) {
      const response = await fetch(API_ENDPOINT, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ action, filters }),
      });

      if (!response.ok) {
        const errorText = await response.text();
        let errorMessage = `Không tải được dữ liệu: ${response.status}`;
        try {
          const errorData = JSON.parse(errorText);
          if (errorData.message) errorMessage = errorData.message;
        } catch (error) {
          if (errorText) errorMessage = errorText.slice(0, 300);
        }
        throw new Error(errorMessage);
      }

      const data = await response.json();
      if (data && data.error) {
        throw new Error(data.message || 'Apps Script trả về lỗi khi xử lý dữ liệu.');
      }
      return data;
    }

    function loadDashboardFromCache() {
      setLoading(true, 'Đang mở dữ liệu đã lưu...');
      fetchDashboard('cached', getFilters())
        .then(handleCachedDashboard)
        .catch(showError);
    }

    function refreshDashboard() {
      setLoading(true, 'Đang cập nhật dữ liệu...');
      fetchDashboard('refresh', getFilters())
        .then(renderDashboard)
        .catch(showError);
    }

    function handleCachedDashboard(data) {
      setLoading(false);
      if (data && data.cacheMiss) {
        state.latestData = null;
        els.periodText.textContent = data.message;
        els.statusText.textContent = 'Chưa có cache';
        els.kpis.innerHTML = '';
        els.todayTable.innerHTML = '<div class="loader">Nhấn Cập nhật để lấy dữ liệu mới nhất và lưu lại cho lần mở sau.</div>';
        els.upcomingTable.innerHTML = '<div class="loader">Chưa có dữ liệu đã lưu.</div>';
        els.typeBars.innerHTML = '<div class="loader">Chưa có dữ liệu đã lưu.</div>';
        els.unitBars.innerHTML = '<div class="loader">Chưa có dữ liệu đã lưu.</div>';
        els.statusBars.innerHTML = '<div class="loader">Chưa có dữ liệu đã lưu.</div>';
        return;
      }
      renderDashboard(data);
    }

    function getFilters() {
      return {
        from: els.fromDate.value,
        to: els.toDate.value,
        type: els.typeFilter.value || state.defaultType,
        status: els.statusFilter.value || state.defaultStatus,
        search: els.searchBox.value,
      };
    }

    function renderDashboard(data) {
      setLoading(false);
      state.latestData = data;
      if (!els.fromDate.value) els.fromDate.value = data.filters.from;
      if (!els.toDate.value) els.toDate.value = data.filters.to;
      renderOptions(data.options, data.filters);
      els.periodText.textContent = `Kỳ báo cáo: ${data.periodLabel} | Sắp vắng: ${data.upcomingLabel} | Ngày báo cáo: ${data.reportDate}`;
      els.statusText.textContent = data.cacheWarning
        ? data.cacheWarning
        : `${data.fromCache ? 'Dữ liệu đã lưu' : 'Vừa cập nhật'}: ${data.generatedAt}`;

      renderKpis([
        { label: 'Đang vắng hôm nay', value: data.kpis.todayAbsent, detailKey: 'todayAbsent', detailType: 'people' },
        { label: 'Sắp vắng 02 tháng', value: data.kpis.upcoming, detailKey: 'upcoming', detailType: 'people' },
        { label: 'Chờ BGĐ duyệt', value: data.kpis.pendingBgd, detailKey: 'pendingBgd', detailType: 'people' },
        { label: 'Tổng ngày vắng kỳ này', value: data.kpis.daysInPeriod, detailKey: 'daysInPeriod', detailType: 'people' },
        { label: 'Nghỉ phép kỳ này', value: data.kpis.leaveDaysInPeriod, detailKey: 'leaveDaysInPeriod', detailType: 'people' },
        { label: 'Hội nghị/công tác kỳ này', value: data.kpis.conferenceDaysInPeriod, detailKey: 'conferenceDaysInPeriod', detailType: 'people' },
        { label: 'Vắng mặt khác kỳ này', value: data.kpis.otherDaysInPeriod, detailKey: 'otherDaysInPeriod', detailType: 'people' },
        { label: 'Đơn vị có vắng', value: data.kpis.activeUnits, detailKey: 'activeUnits', detailType: 'summary' },
        { label: 'Hồ sơ trong kỳ', value: data.kpis.filesInPeriod, detailKey: 'filesInPeriod', detailType: 'people' },
        { label: 'Nghỉ hưu 12 tháng tới', value: data.kpis.retirementsNext12, detailKey: 'retirementsNext12', detailType: 'retirement' },
      ]);

      renderPeopleTable(els.todayTable, data.tables.todayAbsent);
      renderPeopleTable(els.upcomingTable, data.tables.upcoming);
      renderBars(els.typeBars, data.tables.byType, 'teal');
      renderBars(els.unitBars, data.tables.topUnits, 'blue');
      renderBars(els.statusBars, data.tables.byStatus, 'amber');
    }

    function renderOptions(options, filters) {
      if (!state.loadedOptions) {
        fillSelect(els.typeFilter, options.types, filters.type);
        fillSelect(els.statusFilter, options.statuses, filters.status);
        state.loadedOptions = true;
      }
    }

    function fillSelect(select, values, selected) {
      select.innerHTML = values.map(value =>
        `<option value="${escapeHtml(value)}"${value === selected ? ' selected' : ''}>${escapeHtml(value)}</option>`
      ).join('');
    }

    function renderKpis(items) {
      els.kpis.innerHTML = items.map(item => `
        <article class="kpi">
          <div class="label">${escapeHtml(item.label)}</div>
          <div class="value">${formatNumber(item.value)}</div>
          <button type="button" data-detail-key="${escapeHtml(item.detailKey)}" data-detail-title="${escapeHtml(item.label)}" data-detail-type="${escapeHtml(item.detailType)}">Chi tiết</button>
        </article>
      `).join('');
      els.kpis.querySelectorAll('button[data-detail-key]').forEach(button => {
        button.addEventListener('click', () => showDetail(button.dataset.detailKey, button.dataset.detailTitle, button.dataset.detailType));
      });
    }

    function showDetail(detailKey, title, detailType) {
      const rows = state.latestData && state.latestData.details ? state.latestData.details[detailKey] || [] : [];
      els.detailTitle.textContent = title;
      els.detailPanel.classList.add('open');
      if (detailType === 'summary') {
        renderSummaryTable(els.detailBody, rows);
      } else if (detailType === 'retirement') {
        renderRetirementTable(els.detailBody, rows);
      } else {
        renderPeopleTable(els.detailBody, rows);
      }
      els.detailPanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function closeDetail() {
      els.detailPanel.classList.remove('open');
      els.detailBody.innerHTML = '';
    }

    function renderSummaryTable(container, rows) {
      if (!rows.length) {
        container.innerHTML = '<div class="loader">Không có dữ liệu phù hợp.</div>';
        return;
      }

      container.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Nội dung</th>
              <th>Số ngày</th>
            </tr>
          </thead>
          <tbody>
            ${rows.map(row => `
              <tr>
                <td>${escapeHtml(row.label)}</td>
                <td>${formatNumber(row.value)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    function renderRetirementTable(container, rows) {
      if (!rows.length) {
        container.innerHTML = '<div class="loader">Không có dữ liệu phù hợp.</div>';
        return;
      }

      container.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Họ tên</th>
              <th>Đơn vị</th>
              <th>Chức vụ</th>
              <th>Ngày sinh</th>
              <th>Giới tính</th>
              <th>Nghỉ hưu dự kiến</th>
              <th>Còn lại</th>
            </tr>
          </thead>
          <tbody>
            ${rows.map(row => `
              <tr>
                <td>${escapeHtml(row.hoTen)}</td>
                <td>${escapeHtml(row.khoaPhong)}</td>
                <td>${escapeHtml(row.chucVu)}</td>
                <td>${escapeHtml(row.ngaySinh)}</td>
                <td>${escapeHtml(row.gioiTinh)}</td>
                <td>${escapeHtml(row.ngayNghiHuu)}</td>
                <td>${formatNumber(row.conLaiNgay)} ngày</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    function renderPeopleTable(container, rows) {
      if (!rows.length) {
        container.innerHTML = '<div class="loader">Không có dữ liệu phù hợp.</div>';
        return;
      }

      container.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Họ tên</th>
              <th>Đơn vị</th>
              <th>Chức vụ</th>
              <th>Loại</th>
              <th>Bắt đầu</th>
              <th>Kết thúc</th>
              <th>Số ngày</th>
              <th>Lý do</th>
              <th>Duyệt</th>
              <th>Nguồn sheet</th>
            </tr>
          </thead>
          <tbody>
            ${rows.map(row => `
              <tr>
                <td>${escapeHtml(row.hoTen)}</td>
                <td>${escapeHtml(row.khoaPhong)}</td>
                <td>${escapeHtml(row.chucVu)}</td>
                <td>${typeBadge(row.loai)}</td>
                <td>${escapeHtml(row.batDau)}</td>
                <td>${escapeHtml(row.ketThuc)}</td>
                <td>${formatNumber(row.soNgay)}</td>
                <td>${escapeHtml(row.lyDo)}</td>
                <td>${escapeHtml(row.tinhTrangDuyet)}</td>
                <td>${escapeHtml(row.sourceSheet)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    function renderBars(container, rows, color) {
      if (!rows.length) {
        container.innerHTML = '<div class="loader">Không có dữ liệu.</div>';
        return;
      }

      const max = Math.max(...rows.map(row => Number(row.value) || 0), 1);
      container.innerHTML = rows.map(row => {
        const width = Math.max(3, ((Number(row.value) || 0) / max) * 100);
        return `
          <div class="bar-row">
            <div class="bar-label" title="${escapeHtml(row.label)}">${escapeHtml(row.label)}</div>
            <div class="bar-track"><div class="bar-fill ${color}" style="width:${width}%"></div></div>
            <div class="bar-value">${formatNumber(row.value)}</div>
          </div>
        `;
      }).join('');
    }

    function typeBadge(type) {
      const cls = type === 'Hội nghị/công tác'
        ? 'badge work'
        : type === 'Vắng mặt khác'
          ? 'badge other'
          : 'badge';
      return `<span class="${cls}">${escapeHtml(type)}</span>`;
    }

    function setLoading(isLoading, label) {
      els.applyBtn.disabled = isLoading;
      els.applyBtn.textContent = isLoading ? (label || 'Đang tải...') : 'Cập nhật';
    }

    function showError(error) {
      setLoading(false);
      els.statusText.textContent = 'Có lỗi khi tải dữ liệu';
      els.todayTable.innerHTML = `<div class="loader">${escapeHtml(error.message || String(error))}</div>`;
    }

    function formatNumber(value) {
      return new Intl.NumberFormat('vi-VN', { maximumFractionDigits: 2 }).format(Number(value) || 0);
    }

    function escapeHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
